{% extends 'base.html' %}
{% block title %}Recuperar Contraseña | GameStore{% endblock %}

{% block content %}
<style>
    /* Compartimos el mismo CSS exacto del Login */
    .auth-card { background: rgba(31, 40, 51, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(102, 252, 241, 0.15); border-radius: 12px; padding: 40px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); transition: all 0.3s ease; }
    .auth-card:hover { box-shadow: 0 12px 25px rgba(102, 252, 241, 0.2); border-color: #45a29e; }
    .auth-title { color: #66fcf1; font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 25px; text-align: center; }
    .auth-label { color: #45a29e; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; display: block; }
    .auth-input { background-color: rgba(11, 12, 16, 0.7); border: 1px solid rgba(102, 252, 241, 0.3); color: #ffffff; border-radius: 6px; padding: 12px 15px; width: 100%; margin-bottom: 20px; transition: all 0.3s ease; }
    .auth-input:focus { outline: none; border-color: #66fcf1; background-color: rgba(11, 12, 16, 0.9); box-shadow: 0 0 12px rgba(102, 252, 241, 0.4); }
    .btn-auth { background: linear-gradient(45deg, #45a29e, #66fcf1); color: #0b0c10; border: none; width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; }
    .btn-auth:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(102, 252, 241, 0.5); color: #0b0c10; }
    .auth-link { color: #45a29e; text-decoration: none; font-size: 13.5px; transition: color 0.3s; font-weight: 600; }
    .auth-link:hover { color: #66fcf1; text-decoration: underline; }
</style>

<div class="row justify-content-center align-items-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">
            <h2 class="auth-title">🎮 GameStore</h2>
            <p class="text-center text-white-50 mb-4">Ingresa tu correo para recuperar el acceso</p>

            {% if mensaje %}
                <div class="alert alert-info bg-dark text-info border-info p-2 mb-4 text-center" style="font-size: 14px;">
                    {{ mensaje }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div>
                    <label class="auth-label">Correo Electrónico</label>
                    <input type="email" name="email" class="auth-input" placeholder="correo@ejemplo.com" required>
                </div>
                
                <button type="submit" class="btn-auth">Enviar Instrucciones</button>
            </form>

            <div class="text-center mt-4 pt-4 border-top border-secondary">
                <a href="{% url 'login_usuario' %}" class="auth-link">← Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
